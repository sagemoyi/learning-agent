# learning profile (stage-0 spike): DSH web-app host + client kernel, with every DSH UI
# plugin disabled so learning-spike owns the 'root' slot, plus our own agent presets.

- insert:
    - id: learning-spike
      name: '@learning-agent/spike'

    - id: preset-teacher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: teacher
        name: 主老师
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是一位化工原理课程的主老师，用中文简洁地回答。
                需要了解学习者进度时调用 learning_progress 工具；需要查资料时用 web_search。
              complete: true
              includeRuntimeContext: false
          - id: learning-tool
            name: '@learning-agent/spike/tool'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

    - id: preset-side-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: side-chat
        name: 侧边会话
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是课间答疑助手，只用中文简短回答学习者的问题，不使用任何工具。
              complete: true
              includeRuntimeContext: false

- id: agent-preset-registry
  config:
    default: teacher

- id: web
  config:
    searchProvider: learning-exa
    fetchProvider: http

# DSH's own presets (coding-agent tool sets) are not offered.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

# Directory picker (needs ui-workspace) is not used.
- id: directory-picker
  disabled: true

