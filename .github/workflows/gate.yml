# The gate on every push and pull request: no secrets, no paid service. docs/development.md, 测试.
name: gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/setup-dsh.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: sudo apt-get install -y fonts-noto-cjk # so failure screenshots can be read
      - run: pnpm e2e # real DSH and the runner's Chrome, synthetic data and the fake model
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: .scratch/ui/e2e
          if-no-files-found: ignore
