# The Windows installer (docs/settings/proposals/2026-11-05-windows-installer.md): build, stage and package it on
# Windows, install it silently, start it and wait for the workbench, then keep the installer as a run artifact.
# A release (tag v<version>, the version in apps/desktop/package.json) is published after the smoke test when the
# run is started by hand with "release" ticked, or by pushing that tag; installed copies update from it.
name: desktop
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish this build as release v<version of apps/desktop/package.json>
        type: boolean
        default: false
  push:
    tags: ['v*'] # a tag push runs whatever paths changed
    branches: ['**']
    paths:
      - apps/desktop/**
      - scripts/desktop/**
      - scripts/pack.mjs
      - scripts/dsh/**
      - profile/**
      - .github/workflows/desktop.yml
permissions:
  contents: write # the release on a tag
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the installer's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, apps/desktop/package.json $version"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/setup-dsh.sh
        shell: bash
      - run: pnpm build
      - run: pnpm dist
      - run: node scripts/desktop/stage.mjs
      - run: npm ci --no-fund --no-audit
        working-directory: apps/desktop
      - run: npm run package
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: ''
      - name: Install silently and start
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/Microsight-Setup-*.exe | Select-Object -First 1
          "installer: $($setup.Name), $([math]::Round($setup.Length / 1MB)) MB"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Microsight.exe | Select-Object -First 1
          if (-not $exe) { throw 'Microsight.exe is not installed under LOCALAPPDATA\Programs' }
          "installed: $($exe.FullName)"
          $env:NODE_OPTIONS = ''
          node scripts/desktop/smoke.mjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Microsight-Setup
          path: apps/desktop/release/Microsight-Setup-*.exe
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/release
          version=$(node -p "require('../package.json').version")
          gh release create "v$version" --target "$GITHUB_SHA" Microsight-Setup-*.exe Microsight-Setup-*.exe.blockmap latest.yml \
            --title "知微 v$version" --notes "下载 Microsight-Setup-$version.exe 安装；已安装的知微会自动更新。安装说明见 README。"
