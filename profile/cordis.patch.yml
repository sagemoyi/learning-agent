# learning profile: DSH web-app host + client kernel, every DSH UI plugin disabled so our shell
# owns the 'root' slot (stage-0 V1/V2), plus our units and agent presets.
# Installed by scripts/dev-profile.sh into $DSH_HOME/profiles/learning.

- insert:
    # Our units. A package with only a browser half still needs a row: DSH finds client modules
    # by scanning the host loader's rows.
    - id: learning-core
      name: '@learning-agent/core'
    - id: learning-shell
      name: '@learning-agent/shell'
    # Stage-0 step-3 probe (contracts §9); removed once the skeleton is verified.
    - id: learning-probe
      name: '@learning-agent/probe'

    - id: preset-teacher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: teacher
        name: 主老师
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是化工原理课程的主老师，用中文简洁地回答。
              complete: true
              includeRuntimeContext: false

    - id: preset-side-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: side-chat
        name: 侧边会话
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是课间答疑助手，只用中文简短回答学习者的问题。
              complete: true
              includeRuntimeContext: false

- id: agent-preset-registry
  config:
    default: teacher

# DSH's own presets (coding-agent tool sets) are not offered.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

# Directory picker (needs ui-workspace) is not used.
- id: directory-picker
  disabled: true

# DSH UI plugins: all disabled except ui-settings, which provides the configForms service; the client kernel (modules, connection, renderer, theme, session) stays.
